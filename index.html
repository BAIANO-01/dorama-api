<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0b14" />
  <meta name="description" content="IgaraDrama — Seu universo de histórias curtas, minisséries e doramas em alta definição" />
  
  <!-- Mobile & PWA Capabilities -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IgaraDrama" />
  <meta name="application-name" content="IgaraDrama" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <title>IgaraDrama — Histórias que prendem</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('IgaraDrama PWA Service Worker registrado com escopo:', reg.scope))
          .catch((err) => console.warn('Falha ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
